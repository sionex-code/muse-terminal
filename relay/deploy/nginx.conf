# VPS: /etc/nginx/sites-available/muse-mcp
# The MCP endpoint and the worker socket share one hostname and one TLS cert.
server {
    listen 443 ssl http2;
    server_name muse.relay.example.com;

    ssl_certificate     /etc/letsencrypt/live/muse.relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/muse.relay.example.com/privkey.pem;

    # Remote MCP endpoint used by Muse, Claude Code and opencode.
    location /mcp {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    # Persistent socket from each worker machine.
    location /agent {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8787;
    }
}

server {
    listen 80;
    server_name muse.relay.example.com;
    return 301 https://$host$request_uri;
}
